name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Guardar registro si falla
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200 > errores.txt || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan logs
          git rm -rf --cached . > /dev/null
          git add -f errores.txt build.log
          git commit -m "Registro de compilación ${{ github.run_number }}"
          git push -f origin logs

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Liquida.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Liquida 0.1.${{ github.run_number }}
          body: "Descarga **Liquida.apk** e instálalo en tu teléfono."
          files: Liquida.apk
          make_latest: true
